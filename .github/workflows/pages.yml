name: Deploy Standalone PWA

on:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ !github.event.release.prerelease }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build browser-only PWA
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python3 scripts/build-static.py --output dist/static --version "$RELEASE_TAG"
      - name: Test browser storage and service worker
        run: |
          python3 scripts/test-ux-markup.py
          python3 scripts/test-static-manifest.py
          python3 scripts/test-release-version.py
          node scripts/test-pwa-worker.cjs
          node --experimental-default-type=module scripts/test-quick-timer.mjs
          node --experimental-default-type=module scripts/test-standalone-store.mjs
          node scripts/test-recent-timers.mjs
          node --experimental-default-type=module scripts/test-browser-alarms.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static files
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/static
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
